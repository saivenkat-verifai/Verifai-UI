<div class="login-container">
  <div class="left-panel">
    <div class="overlay"></div>
  </div>
  <div class="right-panel">
    <div class="login-box">
      <img src="assets/logo.png" alt="VERIFAI Logo" class="logo-img" />
      <h1 class="mb40 heading">Welcome to sign in</h1>

      <!-- Add (ngSubmit) and #loginForm="ngForm" for Angular form -->
      <form (ngSubmit)="login()" #loginForm="ngForm">
        <!-- Bind inputs with ngModel and name attributes -->
        <span class="username-label">Username</span>
        <input
          type="text"
          placeholder="Enter Username"
          name="username"
          [(ngModel)]="username"
          required
        />
        <span class="password-label">Password</span>
        <input
          type="password"
          placeholder="Password here"
          name="password"
          [(ngModel)]="password"
          required
        />

        <div class="extras">
          <label class="remember-me">
            <input type="checkbox" />
            Remember Password
          </label>
          <a class="forget-password" href="#">Forgot Password?</a>
        </div>

        <button type="submit" [disabled]="!loginForm.form.valid">LOG IN</button>
      </form>

      <!-- Show error message -->
      <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>
    </div>
  </div>
</div>
